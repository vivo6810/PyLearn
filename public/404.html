    <style>
      :root {

        --card2: #262219;
        --border: #3b352a;
        --ink: #efe9db;

      :root[data-theme='light'] {

        --bg2: #ede9dd;
        --card: #fbf9f3;
        --card2: #efece2;
        --border: #cfc7b4;
        --ink: #26231c;
        --text: #262218;
        --muted: #7a7362;

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      h1 {
        font-family: var(--font-hand);
        font-size: clamp(2.4rem, 7vw, 4rem);
        letter-spacing: 0;
        margin: 0 0 10px;
      }
      .code {
        font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
        color: var(--muted);
        background: var(--card2);
        border: 2px solid var(--border);
        border-radius: 999px;
        padding: 4px 12px;
        display: inline-block;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 2px solid var(--ink);
        background: var(--card);
        color: var(--text);
        border-radius: 14px 6px 15px 7px / 7px 14px 6px 15px;
        padding: 10px 20px;
        font-size: 1.05rem;
        cursor: pointer;
        font-family: var(--font-hand-ui);
        box-shadow: 3px 3px 0 var(--shadow-ink);
        transition: transform 0.08s ease, box-shadow 0.08s ease;
        text-decoration: none;
      }
      .btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--shadow-ink); }
      .btn.primary { background: var(--accent); color: var(--ink); font-weight: 600; }
      .muted { color: var(--muted); }
      .squiggle { background: var(--squiggle) no-repeat center / contain; height: 8px; opacity: 0.7; }
    </style>
