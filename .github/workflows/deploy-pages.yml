# Builds the app and publishes it to GitHub Pages.
#
# This deploys the CLIENT ONLY — GitHub Pages cannot run the Node API, so the
# published site runs in guest mode with progress in the browser's localStorage.
# The app detects the missing API on boot and hides the account screens.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Project sites serve from /<repo>/, user sites (username.github.io)
          # serve from the domain root — derive the prefix from the repo name.
          VITE_BASE: ${{ github.event.repository.name == 'PyLearn' && '/PyLearn/' || '/' }}

      - uses: actions/configure-pages@v5

      - name: Prepare legacy URL redirect
        if: github.event.repository.name == 'PyLearn' && github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p legacy-site
          cp public/legacy-redirect.html legacy-site/index.html
          cp public/legacy-redirect.html legacy-site/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.name != 'PyLearn' || github.event_name == 'workflow_dispatch'
        with:
          path: dist

      - uses: actions/upload-pages-artifact@v3
        if: github.event.repository.name == 'PyLearn' && github.event_name != 'workflow_dispatch'
        with:
          path: legacy-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
